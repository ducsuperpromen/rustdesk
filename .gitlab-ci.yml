# ENZU custom-client GitLab CI/CD.
#
# GitLab builds ONE platform: Android arm64-v8a.
# Windows is intentionally NOT built here — it already builds cleanly on GitHub
# hosted runners (see .github/workflows/enzu-build.yml). Running Windows on GitLab
# would require a self-hosted Windows runner + Visual Studio + LLVM + Flutter + Rust
# + vcpkg, which is disproportionate infrastructure for no added value.
#
# Division of labour:
#   GitHub  -> Windows x64  (+ Android arm64 hosted fallback)
#   GitLab  -> Android arm64 (fast, reproducible, via the prebuilt builder image)
#
# All heavy dependencies live in the builder image (Dockerfile.enzu-builder), so this
# pipeline only: checkout -> generate bridge -> build -> upload. See docs/BUILDER_IMAGE.md.
#
# ENZU-specific and additive: does not modify upstream RustDesk files, so
# `git merge upstream/master` stays conflict-free. Designed to run from
# feature/enzu-custom-client; never merged into / run against gitlab `main`.

stages:
  - build

variables:
  VERSION: "1.4.9"                 # artifact naming only; tool versions are baked into the image
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1

android-arm64:
  stage: build
  # Prebuilt ENZU toolchain image. NOT published — build it and make it available to
  # the runner (locally or via a registry). See docs/BUILDER_IMAGE.md.
  image:
    name: enzu/rustdesk-builder:1.0.0
    pull_policy: [if-not-present, always]
  tags:
    - linux
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/enzu-custom-client"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  variables:
    # Keep the Cargo registry + build cache inside the project dir so GitLab can cache them.
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    # Best-effort. A cache miss / cache-service failure must never fail the build.
    key: enzu-android-arm64
    when: always
    paths:
      - .cargo/registry/
      - target/
  script:
    - set -e
    # 0) Verify the ENZU embedded config (single source of truth) before building.
    - python3 scripts/verify_enzu_config.py
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    # 1) Generate flutter-rust-bridge. Codegen uses the pinned bridge Flutter (3.22.3),
    #    already installed in the image; the app is still built with 3.24.5 below.
    - "sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml"
    - export PATH="$BRIDGE_FLUTTER_HOME/bin:$PATH"
    - (cd flutter && flutter pub get)
    - flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
    - git checkout -- flutter/pubspec.yaml
    # Put the app Flutter (3.24.5) first again for the build.
    - export PATH="$FLUTTER_HOME/bin:$PATH"
    - '[ "$FLUTTER_VERSION" = "3.24.5" ] && (cd "$FLUTTER_HOME" && git apply "$CI_PROJECT_DIR/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" 2>/dev/null || true)'
    # 2) vcpkg native deps for arm64-v8a (VCPKG_ROOT + NDK come from the image).
    - ./flutter/build_android_deps.sh arm64-v8a
    # 3) Native Rust lib via cargo-ndk (preinstalled).
    - ./flutter/ndk_arm64.sh
    - mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
    - cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
    - cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/arm64-v8a/
    # 4) APK (debug signing — no release secrets required for ENZU CI artifacts).
    - sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
    - sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
    - (cd flutter && flutter build apk --release --target-platform android-arm64 --split-per-abi)
    - mv flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./enzu-rustdesk-${VERSION}-android-arm64.apk
  artifacts:
    name: enzu-rustdesk-android-arm64-configured
    expire_in: 14 days
    when: on_success
    paths:
      - enzu-rustdesk-${VERSION}-android-arm64.apk
